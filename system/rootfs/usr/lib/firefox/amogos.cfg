// Lower process and cache overhead while retaining Firefox site isolation and acceleration.
defaultPref("dom.ipc.processCount", 2);
defaultPref("dom.ipc.processCount.webIsolated", 1);
defaultPref("dom.ipc.processPrelaunch.enabled", false);
defaultPref("browser.cache.memory.capacity", 32768);
defaultPref("browser.cache.disk.smart_size.enabled", false);
defaultPref("browser.cache.disk.capacity", 131072);
defaultPref("browser.sessionhistory.max_total_viewers", 2);
defaultPref("browser.sessionstore.restore_on_demand", true);
