# Start with the standard LXQt panel layout and replace the menu icon.
panels=panel1

[panel1]
plugins=fancymenu,desktopswitch,quicklaunch,taskbar,statusnotifier,tray,mount,volume,worldclock,showdesktop
position=Top
desktop=0

[fancymenu]
type=fancymenu
ownIcon=true
icon=/usr/share/pixmaps/amogos-menu.png
showText=true
text=AmogOS Arch
alignment=Left
filterClear=true
autoSel=true
autoSelDelay=150

[desktopswitch]
type=desktopswitch

[quicklaunch]
type=quicklaunch
alignment=Left

[taskbar]
type=taskbar
buttonWidth=220
closeOnMiddleClick=true
groupingEnabled=false

[mount]
type=mount

[worldclock]
type=worldclock

[volume]
device=0
type=volume

[showdesktop]
alignment=Right
type=showdesktop

[statusnotifier]
alignment=Right
type=statusnotifier

[tray]
type=tray
